name: validate

# Runs from the base branch with a write token, so the pull request is treated strictly as data: its entry
# files are read through the API and parsed, and nothing from it is checked out or executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.fetch.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the entries of the pull request as data
        id: fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: node tools/ci/fetch-pr-entries.js .tmp/pr

      - name: Validate the entries
        if: steps.fetch.outputs.relevant == 'true'
        run: >
          node tools/validate.js
          --servers servers
          --base servers
          --entries-dir .tmp/pr/servers
          --meta .tmp/pr/meta.json
          --out .tmp/result.json
          --markdown .tmp/comment.md

      - name: Show the result in the job summary
        if: always() && steps.fetch.outputs.relevant == 'true'
        run: |
          if [ -f .tmp/comment.md ]; then cat .tmp/comment.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the result for the comment job
        if: always() && steps.fetch.outputs.relevant == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation
          path: .tmp/comment.md
          if-no-files-found: ignore
          retention-days: 3

  comment:
    needs: validate
    if: always() && needs.validate.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the rendered comment
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: validation
          path: .tmp

      - name: Post or update the comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p .tmp
          if [ ! -s .tmp/comment.md ]; then
            printf '<!-- registry-validation -->\n## Registry validation: did not finish\n\nThe validation job stopped before it produced a result. See the [workflow run](%s).\n' "$RUN_URL" > .tmp/comment.md
          fi
          node tools/ci/post-comment.js .tmp/comment.md '<!-- registry-validation -->'
