name: rescan

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: rescan
  cancel-in-progress: false

jobs:
  rescan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: virustotal
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the lookup cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: virustotal-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: virustotal-

      - name: Compare approved entries with their pinned state and re-scan them
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: node tools/rescan.js --out .tmp/rescan.json

      - name: Show the decisions in the job summary
        if: always()
        run: |
          if [ -f .tmp/rescan.json ]; then
            { echo '```json'; cat .tmp/rescan.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rescan
          path: .tmp/rescan.json
          retention-days: 7

  open-pull-requests:
    needs: rescan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rescan
          path: .tmp

      - name: Open a pull request for every entry that needs approval again
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRY_BOT_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/ci/open-rescan-prs.js .tmp/rescan.json
